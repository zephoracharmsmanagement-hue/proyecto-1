# Configuración de despliegue de zephoracharms.com
#
# Con este archivo, Netlify publica el sitio desde el repositorio en cada push
# y despliega las funciones de netlify/functions/ junto a él. Se acaba el
# arrastrar la carpeta a mano —y con ella el riesgo de soltarla en el proyecto
# equivocado, que "funciona" sin cambiar nada de lo que ve el público—.
#
# El sitio no tiene build: es HTML, CSS y JS servidos tal cual. Lo único que se
# compila son las funciones, y de eso se encarga Netlify solo.

[build]
  publish = "."
  functions = "netlify/functions"
  # Sin comando de build a propósito. Si algún día hace falta, aquí va.
  command = ""

  # No desplegar cuando el push solo cambia documentación.
  #
  # Netlify cobra ~15 créditos por despliegue de producción, dure lo que dure
  # (ver ESTADO.md § Lo primero). Los documentos internos —ESTADO.md, CLAUDE.md,
  # README.md y todo automatizaciones/*.md— no los sirve el sitio: están
  # bloqueados con redirects a 404 más abajo. Publicar un despliegue entero
  # porque alguien corrigió un párrafo es gastar el recurso escaso en cambiar
  # nada.
  #
  # OJO CON LA LÓGICA, QUE ESTÁ INVERTIDA Y ES LA TRAMPA DE ESTE AJUSTE:
  # Netlify SALTA el despliegue cuando este comando termina con código 0, y
  # construye cuando termina distinto de 0. Al revés de lo que sugiere el
  # sentido común. Por eso `git diff --quiet` encaja: da 0 cuando NO hay
  # diferencias fuera de los .md, que es justo cuando no hay nada que publicar.
  #
  # Todo lo demás está escrito para fallar hacia CONSTRUIR, nunca hacia saltar:
  # las dos comprobaciones `-n` cubren que CACHED_COMMIT_REF venga vacío —primer
  # despliegue, caché limpiada, despliegue manual—, caso en el que el `git diff`
  # a secas compararía contra el árbol de trabajo, no encontraría diferencias y
  # saltaría un despliegue que sí hacía falta. Y si el ref no existe en el clon
  # superficial, git sale distinto de 0 y también se construye. Ante la duda,
  # se despliega: cuesta 15 créditos, contra dejar la tienda sin publicar.
  #
  # La exclusión es deliberadamente mínima —solo *.md— porque cada ruta que se
  # añada aquí es una ruta que puede dejar de desplegarse en silencio. Si algún
  # día conviene excluir más, se amplía con la misma batería de pruebas.
  #
  # CÓMO SE NOTA SI SE ROMPE (regla del repo: toda red de seguridad trae su
  # delación). El fallo mudo sería saltarse un despliegue que sí tocaba: se
  # empuja un arreglo del checkout y la tienda sigue con el código viejo, sin
  # error en ningún sitio. La delación es la lista de despliegues de Netlify —
  # un commit que tocó .html, netlify.toml o netlify/functions/ y aparece como
  # saltado significa que esta regla está mal—. Después de tocar esta línea, el
  # primer push que cambie el sitio se comprueba ahí antes de darlo por bueno.
  # Para forzar un despliegue sin esperar: "Trigger deploy" desde el panel de
  # Netlify.
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && [ -n \"$COMMIT_REF\" ] && git diff --quiet \"$CACHED_COMMIT_REF\" \"$COMMIT_REF\" -- . ':(exclude)*.md'"

[functions]
  node_bundler = "esbuild"
  # _precios.js carga los dos por require —los precios para calcular el cobro y
  # el inventario para no cobrar lo que no hay—. esbuild los mete en el paquete,
  # pero se declaran igualmente: si un cambio de bundler los dejara fuera, las
  # funciones se caerían al arrancar y el sitio dejaría de cobrar.
  included_files = ["assets/catalogo.json", "assets/stock.json"]

# Las páginas se piden sin .html
[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

[[redirects]]
  from = "/gracias"
  to = "/gracias.html"
  status = 200

# Nada de esto es parte del sitio: son herramientas, pruebas y scripts internos.
# Publicar la raíz los expondría en URLs adivinables, así que se bloquean.
#
# `force = true` ES LO QUE BLOQUEA, y faltó hasta el 2026-09-24. Netlify no
# aplica una redirección si en esa ruta EXISTE un archivo («shadowing»), así que
# sin él estas reglas nunca hicieron nada: ESTADO.md, CLAUDE.md, docs/,
# automatizaciones/, pruebas/ y herramientas/ respondían 200 en
# zephoracharms.com. Lo delató mirar la vista previa, no el panel ni las
# pruebas. pruebas/paginas.js exige `force` en toda regla 404; el efecto real
# solo se ve con red: tras desplegar, un GET a /ESTADO.md tiene que dar 404.
[[redirects]]
  from = "/pruebas/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/herramientas/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/meta/*"
  to = "/404.html"
  status = 404
  force = true

# Los documentos internos viven en la raíz, que es justo lo que se publica, así
# que no los cubría el bloqueo de las carpetas de arriba: quedaban servidos en
# zephoracharms.com/ESTADO.md. No hay llaves en ellos —esas viven solo en
# Netlify—, pero sí el razonamiento de márgenes, las dudas legales pendientes y
# qué piezas no tienen foto real. Nada de eso se le sirve a una clienta desde el
# dominio de la tienda.
[[redirects]]
  from = "/ESTADO.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/skills-lock.json"
  to = "/404.html"
  status = 404
  force = true

# CLAUDE.md llegó después que las reglas de arriba y por eso hace falta esta
# línea. Trae el hostname del n8n autohospedado, los App IDs de Meta y notas
# operativas internas. Es el segundo documento que aparece en la raíz sin estar
# cubierto: al añadir uno nuevo, hay que acordarse de bloquearlo aquí.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

# Y lo mismo con la carpeta de automatizaciones, que llegó después. Trae los
# márgenes reales por pieza, la utilidad por venta, los planes de pauta y las
# decisiones de negocio. Es exactamente lo que no se le sirve a una clienta
# —ni a la competencia— desde el dominio de la tienda.
[[redirects]]
  from = "/automatizaciones/*"
  to = "/404.html"
  status = 404
  force = true

# Y lo mismo con docs/, que llegó todavía después. Ahí viven las specs de
# superpowers —incluida la de envío-estado, que ya nombra el header de
# autenticación, la variable de entorno y el contrato exacto del endpoint—.
# Publicar esa carpeta sin bloquear sería contarle a quien la encuentre
# justo el mecanismo que la protege.
[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

# Carpetas y archivos del repo que llegaron después y tampoco son del sitio:
# skills de Claude, flujos de GitHub, el FUENTE de las funciones (se ejecutan
# en /.netlify/functions/, con punto, que esto no toca) y la plantilla de
# variables.
[[redirects]]
  from = "/.claude/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.github/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.example"
  to = "/404.html"
  status = 404
  force = true

# El enlace que reanuda un pedido sin pagar. Va con nombre propio porque viaja
# en un correo a una clienta: /.netlify/functions/… en la barra del navegador
# parece cualquier cosa menos una tienda.
[[redirects]]
  from = "/reanudar"
  to = "/.netlify/functions/reanudar"
  status = 200

# El que arma un carrito para el bot de WhatsApp. No escribe nada y no cobra:
# valida, calcula el precio con el mismo código que el checkout, y devuelve un
# enlace a /checkout.html. Va con nombre propio por el mismo motivo que el de
# arriba —lo llama n8n desde un workflow y se lee en su configuración—.
[[redirects]]
  from = "/armar-carrito"
  to = "/.netlify/functions/armar-carrito"
  status = 200

# Ventas cerradas por WhatsApp y pagadas por fuera: las registra el formulario
# de n8n para que descuenten inventario como una venta web. Protegido por
# header (VENTA_MANUAL_KEY), ver registrar-venta.mjs.
[[redirects]]
  from = "/registrar-venta"
  to = "/.netlify/functions/registrar-venta"
  status = 200

# Suscripción por correo con doble confirmación: el formulario del sitio hace
# POST aquí, y los enlaces de los correos (confirmar / darse de baja) son GET a
# esta misma ruta. Nombre propio porque viaja en correos a clientas.
[[redirects]]
  from = "/suscribir"
  to = "/.netlify/functions/suscribir"
  status = 200

# Reseñas de producto: el formulario de la página hace POST aquí, y los enlaces
# de moderación del correo a la tienda son GET a esta misma ruta.
[[redirects]]
  from = "/resenas"
  to = "/.netlify/functions/resenas"
  status = 200

# Videos de la tienda (bloques de la ficha), desde Netlify Blobs: los videos
# no se comitean. Ver netlify/functions/media.mjs y herramientas/subir_media.mjs.
[[redirects]]
  from = "/media/*"
  to = "/.netlify/functions/media?f=:splat"
  status = 200

# La lista de suscriptoras confirmadas para n8n. Protegida por header
# (SUSCRIPTORES_KEY), ver suscriptores-export.mjs.
[[redirects]]
  from = "/suscriptores-export"
  to = "/.netlify/functions/suscriptores-export"
  status = 200

# El que recibe el aviso de estado de envío desde n8n, después de que n8n
# reconoce un correo de Skydropx. Va con nombre propio por el mismo motivo
# que /armar-carrito: lo llama n8n desde un workflow y se lee en su
# configuración. Protegido por header —no por la URL—, ver envio-estado.mjs.
[[redirects]]
  from = "/envio-estado"
  to = "/.netlify/functions/envio-estado"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# El checkout maneja datos personales: que no quede en ninguna caché intermedia.
[[headers]]
  for = "/checkout.html"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/gracias.html"
  [headers.values]
    Cache-Control = "no-store"

# El inventario y los precios cambian sin que cambie su nombre de archivo:
# se revalidan siempre en vez de servirse de caché.
[[headers]]
  for = "/assets/*.json"
  [headers.values]
    Cache-Control = "no-cache"

# El motor del carrito y sus estilos, compartidos por index.html y las páginas
# de colección. Mismo problema que el JSON de arriba y peor consecuencia: el
# nombre no cambia al cambiar el código, así que sin esto una clienta que ya
# visitó la tienda podría seguir ejecutando un carrito viejo —con precios o
# reglas de inventario anteriores— después de desplegar el arreglo. `no-cache`
# no prohíbe guardarlo: obliga a revalidar contra el servidor, así que sigue
# ahorrando la descarga cuando no ha cambiado.
[[headers]]
  for = "/tienda.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/tienda.css"
  [headers.values]
    Cache-Control = "no-cache"

# OJO: las fotos conservan el nombre al cambiar, así que con esta cabecera una
# clienta que ya visitó la tienda sigue viendo la foto vieja hasta una semana
# después de desplegarla. Pasó: se limpiaron 20 fotos y en producción seguían
# saliendo las sucias. Por eso las URL llevan `?v=AAAAMMDD` en index.html y
# checkout.html. **Al cambiar una foto hay que subir esa versión**, o el cambio
# no lo ve quien ya tenía la anterior en caché.
#
# Con el nombre versionado, una semana es un término medio
# entre no repetir descargas y no dejar una foto vieja pegada un mes.
[[headers]]
  for = "/assets/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"
